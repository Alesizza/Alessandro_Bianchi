<div class="container">
    <h1>Quiz: Gaming e Gioco d'Azzardo</h1>
    <form id="quizForm">
        <div id="quizContent"></div>
        <button type="button" onclick="calcolaRisultato()">Invia Risposte</button>
    </form>
    <div id="result"></div>
</div>

<script>
    const questions = [
        { q: "Qual era il ricavo globale dell'industria dei videogiochi nel 2023?", a: ["33 miliardi $", "184 miliardi $", "28 miliardi $", "136 miliardi $"], c: 1 },
        { q: "In Italia, qual è l'età media dei videogiocatori?", a: ["16 anni", "21 anni", "31 anni", "42 anni"], c: 2 },
        { q: "Quale gioco nel 1993 scatenò il primo 'panico morale' sui videogiochi violenti?", a: ["Pong", "Super Mario Bros", "Doom", "Final Fantasy VII"], c: 2 },
        { q: "Cos'è la VRRS (Variable Ratio Reinforcement Schedule)?", a: ["Un software VR", "Un sistema di ricompense imprevedibili", "Un tipo di abbonamento", "Una tecnica di grafica"], c: 1 },
        { q: "Quale ormone è legato all'anticipazione del piacere e all'incertezza?", a: ["Adrenalina", "Serotonina", "Dopamina", "Ossitocina"], c: 2 },
        { q: "Cosa si intende per 'Stato di Flow'?", a: ["Un malfunzionamento del server", "L'eccessivo riscaldamento del PC", "Un equilibrio tra sfida e abilità", "La velocità di download"], c: 2 },
        { q: "Qual è la stima degli spettatori di eSport in Italia?", a: ["1 milione", "3 milioni", "17 milioni", "500 mila"], c: 1 },
        { q: "In che anno l'OMS ha inserito il Gaming Disorder nell'ICD-11?", a: ["2015", "2020", "2019", "2023"], c: 2 },
        { q: "Quale percentuale di giocatori soddisfa i criteri per il Gaming Disorder?", a: ["10-15%", "1-3%", "Oltre il 50%", "Meno dello 0,1%"], c: 1 },
        { q: "Cosa dice il consenso scientifico attuale sul legame tra videogiochi e violenza reale?", a: ["C'è un legame diretto", "Causano violenza solo nei minori", "Non esiste evidenza robusta di causalità", "I videogiochi riducono sempre la violenza"], c: 2 },
        { q: "Quali sono i tre elementi giuridici del gioco d'azzardo?", a: ["Posta, abilità, divertimento", "Posta, aleatorietà, prevalenza del caso", "Internet, denaro, fortuna", "Puntata, perdita, vincita"], c: 1 },
        { q: "A quanto ammontano circa le entrate erariali annue dallo Stato dall'azzardo?", a: ["14 miliardi €", "136 miliardi €", "19 miliardi €", "2 miliardi €"], c: 0 },
        { q: "Cosa sono le loot box?", a: ["Livelli segreti", "Contenuti a pagamento con ricompense casuali", "Console portatili", "Joystick speciali"], c: 1 },
        { q: "In quale paese le loot box sono già regolate come gioco d'azzardo?", a: ["Italia", "Giappone", "Belgio", "USA"], c: 2 },
        { q: "Cos'è lo 'Skin Gambling'?", a: ["Vendere il proprio account", "Scommettere skin su siti terzi", "Comprare vestiti digitali", "Un tipo di trucco nel gioco"], c: 1 },
        { q: "Quale decreto ha vietato la pubblicità dell'azzardo in Italia?", a: ["Decreto Dignità (2018)", "Decreto Lgs. 158/2019", "Legge Biagi", "Codice del Consumo"], c: 0 },
        { q: "Cos'è l'RTP in matematica del gioco?", a: ["Real Time Play", "Return To Player (Ritorno al giocatore)", "Rate of Total Profit", "Rendimento Tecnico Partita"], c: 1 },
        { q: "Qual è la fallacia del giocatore?", a: ["Pensare di poter sempre vincere", "Credere che eventi passati influenzino esiti futuri indipendenti", "Barare durante i tornei", "Scommettere più di quanto si ha"], c: 1 },
        { q: "Qual è l'RTP tipico di un Gratta e Vinci?", a: ["97.3%", "Circa 73%", "50%", "90%"], c: 1 },
        { q: "A chi ci si può rivolgere per problemi di azzardo patologico (GAP)?", a: ["Polizia postale", "SerD o Numero Verde 800.558.822", "Banca d'Italia", "Solo psicologi privati"], c: 1 }
    ];

    function loadQuiz() {
        const content = document.getElementById('quizContent');
        questions.forEach((q, index) => {
            let html = `<div class="question">
                <p><strong>${index + 1}. ${q.q}</strong></p>
                <ul class="options">`;
            q.a.forEach((opt, i) => {
                html += `<li><input type="radio" name="q${index}" value="${i}"> ${opt}</li>`;
            });
            html += `</ul></div>`;
            content.innerHTML += html;
        });
    }

    function calcolaRisultato() {
        let score = 0;
        questions.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === q.c) {
                score++;
            }
        });

        const voto = (score / questions.length) * 10;
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        
        let messaggio = `Hai risposto correttamente a ${score} su ${questions.length} domande.<br>`;
        messaggio += `Il tuo voto è: ${voto.toFixed(1)} / 10.<br>`;

        if (voto >= 6) {
            resultDiv.className = 'promosso';
            messaggio += "ESITO: PROMOSSO";
        } else {
            resultDiv.className = 'bocciato';
            messaggio += "ESITO: BOCCIATO";
        }
        
        resultDiv.innerHTML = messaggio;
        window.scrollTo(0, document.body.scrollHeight);
    }

    window.onload = loadQuiz;
</script>
